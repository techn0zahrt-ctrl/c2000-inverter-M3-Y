name: CAN logger framing

on: [push, pull_request]

permissions:
  contents: read

jobs:
  framing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build framing check with sanitizers
        run: |
          for source in my_fp my_string; do
            cc -std=c99 -Wall -Wextra -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer -g \
              -Ilibopeninv/include -c "libopeninv/src/$source.c" \
              -o "$RUNNER_TEMP/$source.o"
          done
          c++ -std=c++11 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Iinclude -Ilibopeninv/include -Iplatform/c2000/inverter \
            test/testcanlogger.cpp platform/c2000/inverter/canlogger.cpp \
            libopeninv/src/canhardware.cpp libopeninv/src/printf.cpp \
            "$RUNNER_TEMP/my_fp.o" "$RUNNER_TEMP/my_string.o" \
            -o "$RUNNER_TEMP/canlogger-test"
      - name: Check message boundaries
        run: '"$RUNNER_TEMP/canlogger-test"'
